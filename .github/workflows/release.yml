name: Release

# Push a tag like v0.2.0 (created by `npm version`). The release is
# created as a draft; publishing it makes the update visible to installed apps.
# Its text comes from CHANGELOG.md and CHANGELOG.en.md: the tag's section in
# both languages on the release page, and every released section in
# latest.json, which the app shows (in its language) before updating.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-22.04
    outputs:
      body: ${{ steps.body.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release notes from the changelog
        id: body
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs check "$version"
          {
            echo 'body<<STACKYARD_NOTES_EOF'
            node scripts/changelog.mjs body "$version"
            echo 'STACKYARD_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-2022
            args: ''
          - os: macos-15
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Stackyard ${{ github.ref_name }}
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # After every platform uploaded its part of latest.json.
  updater-notes:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version history into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP"
          node scripts/changelog.mjs updater-notes "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --clobber
