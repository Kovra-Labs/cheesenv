name: Binaries

# Builds Linux/macOS binaries for modules without official ones (Redis, Apache)
# from their verified upstream sources, and uploads them to the GitHub release
# `<module>-<version>` (a pre-release, so the app updater never picks it).
# Started by "Registry update" when a version is missing, or by hand.
on:
  workflow_dispatch:
    inputs:
      module:
        description: Module
        type: choice
        options: [redis, apache]
      version:
        description: Upstream version, e.g. 8.10.3
        required: true

permissions:
  contents: write

concurrency:
  group: binaries-${{ inputs.module }}-${{ inputs.version }}

env:
  MODULE: ${{ inputs.module }}
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check input
        run: '[[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "bad version"; exit 1; }'
      - uses: actions/checkout@v4
      - name: Build
        run: registry/build/"$MODULE".sh "$VERSION" out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.module }}-${{ matrix.os }}
          path: out/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$MODULE-$VERSION"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --prerelease --latest=false --title "$MODULE $VERSION (CheesEnv build)" \
              --notes "Portable $MODULE $VERSION for Linux and macOS, built from the official source by .github/workflows/binaries.yml (run ${{ github.run_id }})."
          gh release upload "$tag" out/*.tar.gz --clobber
          sha256sum out/*.tar.gz
