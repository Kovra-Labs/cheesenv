name: Registry

# Publishes the signed module registry (registry/dist, built locally with
# `npm run registry build`) to GitHub Pages: https://kovra-labs.github.io/cheesenv
on:
  push:
    branches: [main]
    paths: ['registry/dist/**', '.github/workflows/registry.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy run in separate jobs (GitHub's Pages template): when
# deploy-pages runs in the same job right after the upload, its artifact
# lookup can come back empty ("No artifacts named github-pages were found").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check registry files
        run: test -s registry/dist/index.json && test -s registry/dist/index.json.minisig
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: registry/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
