name: Registry

# Publishes the signed module registry (registry/dist, built locally with
# `npm run registry build`) to GitHub Pages: https://pipsyrs.github.io/stackyard
on:
  push:
    branches: [main]
    paths: ['registry/dist/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check registry files
        run: test -s registry/dist/index.json && test -s registry/dist/index.json.minisig
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: registry/dist
      - id: deployment
        uses: actions/deploy-pages@v5
