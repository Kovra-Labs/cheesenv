[package]
name = "stackyard"
version = "0.3.0"
description = "Cross-platform local development environment manager"
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "stackyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "fs", "time", "sync", "macros", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
hex = "0.4"
minisign-verify = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
liblzma = { version = "0.4.9", features = ["static"] }
getrandom = "0.3"
portable-pty = "0.9"
rcgen = "0.14"
time = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
